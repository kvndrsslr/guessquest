name: CI
permissions:
  actions: read
on:
  push:
    branches: main
    tags-ignore:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # mlugg/setup-zig has no Node 24 release yet (v2.2.1 still targets Node 20),
      # so install the toolchain directly. The version is read from build.zig.zon
      # and the download is checksum-verified.
      - name: Install Zig
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*\.minimum_zig_version = "\([^"]*\)".*/\1/p' build.zig.zon)
          target="$(uname -m)-linux"
          index=$(curl -fsSL https://ziglang.org/download/index.json)
          tarball=$(jq -r --arg v "$version" --arg t "$target" '.[$v][$t].tarball' <<<"$index")
          shasum=$(jq -r --arg v "$version" --arg t "$target" '.[$v][$t].shasum' <<<"$index")
          curl -fsSL "$tarball" -o /tmp/zig.tar.xz
          echo "$shasum  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm run build:ci

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: guessquest-server-aarch64
          path: zig-out/bin/guessquest-server

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Setup Volta
        run: |
          export VOLTA_HOME="$HOME/.volta"
          export PATH="$VOLTA_HOME/bin:$PATH"

      - name: Download server binary
        uses: actions/download-artifact@v7
        with:
          name: guessquest-server-aarch64
          path: .

      - name: Setup Executable
        run: chmod +x guessquest-server && mv guessquest-server ~/sites/guessquest-server/guessquest-server

      - name: Restart server
        run: pm2 restart guessquest-server &>/dev/null
