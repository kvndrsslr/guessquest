name: CD
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # mlugg/setup-zig has no Node 24 release yet (v2.2.1 still targets Node 20),
      # so install the toolchain directly. The version is read from build.zig.zon
      # and the download is checksum-verified.
      - name: Install Zig
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*\.minimum_zig_version = "\([^"]*\)".*/\1/p' build.zig.zon)
          target="$(uname -m)-linux"
          index=$(curl -fsSL https://ziglang.org/download/index.json)
          tarball=$(jq -r --arg v "$version" --arg t "$target" '.[$v][$t].tarball' <<<"$index")
          shasum=$(jq -r --arg v "$version" --arg t "$target" '.[$v][$t].shasum' <<<"$index")
          curl -fsSL "$tarball" -o /tmp/zig.tar.xz
          echo "$shasum  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm run build:all

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} v${tag#v}" \
              --generate-notes \
              ./zig-out/bin/*
